async function sync(){const{data:{session}}=await sb.auth.getSession();D={users:[],tx:[],log:[]};me=null;if(!session)return;
const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!p||p.status!='active'){await sb.auth.signOut();return}
const A=p.role=='admin',[pr,tx,gl,dp,lg]=await Promise.all([A?sb.from('profiles').select('*'):{data:[p]},sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(500),sb.from('goals').select('*').order('created_at'),sb.from('goal_deposits').select('*'),A?sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(40):{data:[]}]);

D.users=pr.data.map(x=>({id:x.id,email:x.email,name:x.name,role:x.role,phone:x.phone||'',acct:x.acct,status:x.status,joined:x.created_at,prefs:x.prefs,tfa:x.tfa,card:{frozen:x.card_frozen,num:x.card_num,exp:x.card_exp},goals:[]}));

P.home=()=>`<div class="hero"><div><span class="eyebrow">Simulated digital banking</span><h1>Your money, made clear.</h1><p>Send money, pay bills, save toward goals and manage a virtual card from one secure workspace, running entirely on simulated funds.</p><a class="btn" href="#register">Create your account</a> <a class="btn s" href="#login" style="color:#fff!important;border-color:#2a4660!important">Sign in</a></div><div class="mock" aria-hidden="true"><div class="pc" style="max-width:none;aspect-ratio:1.9"><div class="pt"><b>PAYNEX</b><span>Active</span></div><div class="chip"></div><div class="n">•••• •••• •••• 4821</div><div class="pb"><div><small>Cardholder</small><br>ALEX MORGAN</div><div class="mc"><i></i><i></i></div></div></div><div class="led"><div><span>Grocery Hub</span><b>−$64.20</b></div><div><span>Salary</span><b class="ok">+$2,400.00</b></div><div><span>Savings: Lisbon trip</span><b>−$200.00</b></div></div><small class="cap">Illustrative sample data</small></div></div>
<section id="services"><h2>Everything in one place</h2><div class="g">${[['send','Transfers','Send money to other PAYNEX customers with a confirmation step and a printable receipt.'],['bolt','Payments','Buy airtime and pay electricity, internet and water bills.'],['card','Virtual card','Check your card details and freeze or unfreeze it instantly.'],['pig','Savings goals','Set a target, add funds and watch your progress.'],['list','Transaction history','Search and filter by date, type and status.'],['user','Admin tools','Monitor activity and manage customers.']].map(([i,t,d])=>`<div class="card">${ic(i)}<h3>${t}</h3><p class="mut" style="margin:0">${d}</p></div>`).join('')}</div></section>
<section><h2>How it works</h2><ol class="g" style="list-style:none;padding:0;margin:0">${[['Create your account','Register with your email in under a minute.'],['Move money','Transfer, pay bills and save toward goals.'],['Stay in control','Review history, print receipts and freeze your card any time.']].map(([a,b],i)=>`<li class="card"><b>${i+1}. ${a}</b><br><span class="mut">${b}</span></li>`).join('')}</ol></section>
<section id="security"><h2>Security by design</h2><div class="g"><div class="card">${ic('shield')}<h3>Private by default</h3><p class="mut" style="margin:0">Row-level database security means each customer can only read their own records.</p></div><div class="card"><h3>Server-side checks</h3><p class="mut" style="margin:0">Transfers, payments and savings are validated by the database, not just the browser.</p></div><div class="card"><h3>Role-based admin</h3><p class="mut" style="margin:0">Administrative actions are restricted to approved admin accounts and logged.</p></div></div></section>
<section id="faq"><h2>Questions</h2>${[['Is PAYNEX a bank?','No. PAYNEX is not a licensed bank or payment provider. Every balance and transaction is simulated and no real money is held or moved.'],['Can I connect a real bank account or card?','No, and you should never enter real banking details. Real payments would require licensing, compliance and authorised financial partners.'],['Where is my data stored?','In a Supabase database protected by row-level security, so you only see your own records.'],['Who can use admin tools?','Only accounts approved as admins in the database.']].map(([q,a])=>`<details><summary>${q}</summary><p class="mut">${a}</p></details>`).join('')}</section>
<div class="cta"><h2>Explore PAYNEX</h2><p>Create an account and try every feature with simulated funds.</p><a class="btn" href="#register">Get started</a></div><p class="legal" style="margin-top:24px">PAYNEX is a simulated banking platform and is not currently a licensed bank or payment provider. No real funds are held, processed or moved.</p>`;
P.login=()=>`<form class="card narrow" onsubmit="login(event)" novalidate><h2>Sign in</h2><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="username"><label for="p">Password</label>${PWF('p','pw','current-password')}<div class="msg" role="alert"></div><button style="width:100%">Sign in</button><p style="margin-top:16px"><a href="#forgot">Forgot password?</a> · <a href="#register">Create account</a></p></form>`;
P.register=()=>`<form class="card narrow" onsubmit="reg(event)" novalidate><h2>Create your account</h2><label for="n">Full name</label><input id="n" name="name" autocomplete="name"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email"><label for="p">Password (8+ characters, letters and a number)</label>${PWF('p','pw','new-password','oninput="hint(this)"')}<div class="hint" id="hn" aria-live="polite"></div><label for="c">Confirm password</label>${PWF('c','cf','new-password')}<div class="msg" role="alert"></div><button style="width:100%">Create account</button><p class="mut" style="margin-top:12px">PAYNEX is a simulated environment. Never enter real banking details.</p></form>`;
P.forgot=()=>`<form class="card narrow" onsubmit="forgot(event)" novalidate><h2>Reset password</h2><label for="e">Account email</label><input id="e" name="email" type="email"><div class="msg" role="alert"></div><button style="width:100%">Send reset link</button></form>`;
async function login(e){const f=fd(e),em=(f.email||'').trim().toLowerCase();if(!em||!f.pw)return fail(e,'Enter your email and password.');const{error}=await sb.auth.signInWithPassword({email:em,password:f.pw});if(error)return fail(e,error.message);await sync();if(!me)return fail(e,'This demo account is suspended or has no profile.');toast('Welcome back, '+me.name.split(' ')[0]);go(me.role=='admin'?'admin':'dashboard');render()}
async function reg(e){const f=fd(e),em=(f.email||'').trim().toLowerCase();if((f.name||'').trim().length<2)return fail(e,'Enter your full name.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return fail(e,'Enter a valid email address.');if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.pw||''))return fail(e,'Password needs 8+ characters with letters and a number.');if(f.pw!=f.cf)return fail(e,'Passwords do not match.');const{data,error}=await sb.auth.signUp({email:em,password:f.pw,options:{data:{name:f.name.trim()}}});if(error)return fail(e,error.message);if(!data.session){e.target.innerHTML='<h2>Check your email</h2><p class="mut">Confirm your address, then sign in.</p><a class="btn" href="#login">Sign in</a>';return}await sync();toast('Welcome to PAYNEX – your account is ready');go('dashboard');render()}
async function forgot(e){const f=fd(e);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email||''))return fail(e,'Enter a valid email address.');await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:location.href.split('#')[0]});e.target.innerHTML='<h2>Check your inbox</h2><p class="mut">If that account exists, a reset link has been sent. Following it signs you in; then set a new password under Settings.</p><a class="btn" href="#login">Back to sign in</a>'}
const AV={Transfer:"send",Airtime:"bolt",Bill:"bolt",Savings:"pig",Income:"user",Card:"card"};
const st=s=>`<span class="st ${s=='Completed'||s=='active'?'ok':'bad'}">● ${s}</span>`;
const tr=(t)=>`<tr class="c" tabindex="0" onclick="detail('${t.id}')" onkeydown="if(event.key=='Enter')detail('${t.id}')"><td>${dt(t.date)}</td><td><span class="av">${ic(AV[t.type]||'list')}</span>${esc(t.title)}</td><td><span class="pill">${t.type}</span></td><td class="${t.amt<0?'':'ok'}">${money(t.amt)}</td><td>${st(t.status)}</td></tr>`;
const mine=()=>D.tx.filter(t=>t.uid==me.email);
const tbl=a=>a.length?`<div class="tl"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${a.map(tr).join('')}</tbody></table></div>`:`<div class="empty">${ic('list')}<b>No transactions yet</b><span class="mut">Send money or pay a bill and it will appear here.</span></div>`;
const wk=()=>{const d=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return x}),v=d.map(x=>-mine().filter(t=>t.status=='Completed'&&t.amt<0&&t.type!='Savings'&&new Date(t.date).toDateString()==x.toDateString()).reduce((a,t)=>a+t.amt,0)),m=Math.max(1,...v);return `<div class="wk" role="img" aria-label="Spending, last 7 days">${v.map((n,i)=>`<div><b style="height:${Math.max(4,n/m*100)}%" title="${money(n)}"></b><span>${'SMTWTFS'[d[i].getDay()]}</span></div>`).join('')}</div>`};
P.dashboard=()=>{const t=mine().filter(x=>x.status=='Completed'),sp=t.filter(x=>x.amt<0&&x.type!='Savings'),inc=t.filter(x=>x.amt>0).reduce((a,x)=>a+x.amt,0),exp=-sp.reduce((a,x)=>a+x.amt,0),sv=me.goals.reduce((a,g)=>a+g.saved,0),cat={},h=new Date().getHours();sp.forEach(x=>cat[x.type]=(cat[x.type]||0)-x.amt);const mx=Math.max(1,...Object.values(cat));
return `<p class="mut" style="margin:0">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}</p><h2>${esc(me.name.split(' ')[0])}</h2><div class="stats"><div class="card hb"><span style="opacity:.75">Available balance</span><div class="big">${money(bal(me))}</div><div style="font-size:12px;opacity:.65;margin-top:4px">${money(sv)} in savings goals · simulated funds</div></div><div class="card"><span class="mut">Income</span><div class="big ok">${money(inc)}</div></div><div class="card"><span class="mut">Spending</span><div class="big">${money(exp)}</div></div></div>
<div class="qa">${[['transfer','send','Send money'],['payments','bolt','Pay a bill'],['savings','pig','Savings'],['cards','card','View card']].map(([k,i,x])=>`<a class="card" href="#${k}">${ic(i)}<span>${x}</span></a>`).join('')}</div>
<div class="two"><div class="card"><h3>Spending overview</h3>${wk()}${Object.entries(cat).map(([k,v])=>`<p style="margin:0 0 6px;display:flex;justify-content:space-between"><span>${k}</span><span class="mut">${money(v)}</span></p><div class="bar2" style="margin-bottom:12px"><b style="width:${v/mx*100}%"></b></div>`).join('')||'<p class="mut">Your spending breakdown will appear here.</p>'}</div><div class="card"><h3>Account</h3><dl class="dl"><dt>Account no.</dt><dd>${me.acct}</dd><dt>Email</dt><dd>${esc(me.email)}</dd><dt>Member since</dt><dd>${dt(me.joined)}</dd></dl></div></div>
<div class="card" style="margin-top:16px"><h3>Recent transactions</h3>${tbl(mine().slice(0,5))}<a href="#history">View all</a></div>`};
function rcpt(t){return `<div class="modal" onclick="if(event.target==this)closeM()"><div class="card" role="dialog" aria-label="Receipt"><div style="display:flex;justify-content:space-between;align-items:center"><b>PAYNEX</b>${st(t.status)}</div><div class="mut" style="font-size:13px;margin-top:4px">Transaction receipt</div><p class="big ${t.amt<0?'':'ok'}">${money(t.amt)}</p><table>${[['Description',t.title],['Type',t.type],['Status',t.status],['Date',new Date(t.date).toLocaleString()],['Reference',t.ref],['Transaction ID',t.id],['Note',t.note||'–']].map(([a,b])=>`<tr><th>${a}</th><td style="white-space:normal">${esc(b)}</td></tr>`).join('')}</table><p class="mut" style="margin-top:12px;font-size:13px">Simulated transaction. No real funds were moved. PAYNEX is not a licensed bank or payment provider.</p><div class="np"><button onclick="print()">Print receipt</button> <button class="s" onclick="closeM()">Close</button></div></div></div>`}
const detail=id=>{$('#m').innerHTML=rcpt(D.tx.find(t=>t.id==id))},closeM=()=>$('#m').innerHTML='';
P.transfer=()=>{const s=V.tr;if(s.step==1)return `<form class="card narrow" onsubmit="trNext(event)" novalidate><h2>Send money</h2><p class="mut">Available balance: ${money(bal(me))}</p><label for="r">Recipient name</label><input id="r" name="rn" value="${esc(s.rn||'')}"><label for="a">Recipient email or account no.</label><input id="a" name="ra" value="${esc(s.ra||'')}" placeholder="amina@paynex.demo"><label for="m">Amount (USD)</label><input id="m" name="amt" type="number" step="0.01" min="0.01" value="${s.amt||''}"><label for="o">Note (optional)</label><input id="o" name="note" maxlength="60" value="${esc(s.note||'')}"><div class="msg" role="alert"></div><button style="width:100%">Review transfer</button></form>`;
if(s.step==2)return `<div class="card narrow"><h2>Confirm transfer</h2><p>Send <b>${money(+s.amt)}</b> to <b>${esc(s.rn)}</b> (${esc(s.ra)})?</p><p class="mut">${esc(s.note||'No note')}</p><button onclick="trGo()">Confirm and send</button> <button class="s" onclick="V.tr.step=1;render()">Edit</button></div>`;
if(s.step==3)return `<div class="card narrow"><h2>Processing…</h2><p class="mut">Verifying and settling your demo transfer.</p></div>`;
return `<div class="card narrow"><h2 class="ok">Transfer completed</h2><p>${money(+s.amt)} sent to ${esc(s.rn)}.</p><button onclick="detail('${s.id}')">View receipt</button> <button class="s" onclick="V.tr={step:1};render()">New transfer</button></div>`};
function trNext(e){const f=fd(e),a=+f.amt;if((f.rn||'').trim().length<2)return fail(e,'Enter the recipient’s name.');if((f.ra||'').trim().length<4)return fail(e,'Enter a recipient email or account number.');if(!(a>0))return fail(e,'Enter an amount greater than 0.');if(a>10000)return fail(e,'Demo limit is $10,000 per transfer.');if(a>bal(me))return fail(e,'Insufficient balance.');if(f.ra.trim().toLowerCase()==me.email)return fail(e,'You can’t send money to yourself.');V.tr={step:2,...f};render()}
async function trGo(){const s=V.tr;V.tr.step=3;render();const{data,error}=await sb.rpc('demo_transfer',{recipient:s.ra.trim(),recipient_name:s.rn.trim(),amt:+s.amt,memo:s.note||''});if(error){V.tr={...s,step:1};await sync();render();return toast(error.message,1)}await sync();V.tr={...s,step:4,id:data};render();toast('Transfer completed')}
const PROV={air:['Nova Mobile','Zeta Telecom','Orbit Wireless'],bill:['Electricity – VoltCo','Internet – FibreNet','Water – AquaCity']};
P.payments=()=>{const k=V.pay,h=mine().filter(t=>['Airtime','Bill'].includes(t.type));return `<h2>Payments</h2><div class="tabs"><button class="${k=='air'?'on':''}" onclick="V.pay='air';render()">Airtime</button><button class="${k=='bill'?'on':''}" onclick="V.pay='bill';render()">Bills</button></div><form class="card" style="max-width:420px" onsubmit="pay(event)" novalidate><label for="pv">${k=='air'?'Network':'Provider'}</label><select id="pv" name="pv">${PROV[k].map(p=>`<option>${p}</option>`).join('')}</select><label for="ac">${k=='air'?'Phone number':'Customer account number'}</label><input id="ac" name="ac" inputmode="numeric"><label for="am">Amount (USD)</label><input id="am" name="amt" type="number" step="0.01" min="1"><p class="mut" style="font-size:13px">Paid with your virtual card${me.card.frozen?' <b class="bad">(frozen – unfreeze to pay)</b>':''}.</p><div class="msg" role="alert"></div><button>Pay now</button></form><div class="card" style="margin-top:16px"><h3>Payment history</h3>${tbl(h)}</div>`};
async function pay(e){const f=fd(e),a=+f.amt,k=V.pay;if(!/^\d{6,14}$/.test((f.ac||'').replace(/\s/g,'')))return fail(e,'Enter a valid number (6–14 digits).');if(!(a>=1))return fail(e,'Minimum payment is $1.00.');if(a>bal(me))return fail(e,'Insufficient balance.');if(me.card.frozen)return fail(e,'Your card is frozen. Unfreeze it on the Cards page.');const{data,error}=await sb.rpc('demo_pay',{kind:k=='air'?'Airtime':'Bill',provider:(k=='air'?'Airtime – ':'')+f.pv,account:f.ac,amt:a});if(error)return fail(e,error.message);await sync();render();toast('Payment successful');detail(data)}
P.cards=()=>{const c=me.card,n=V.show?c.num:'•••• •••• •••• '+c.num.slice(-4);return `<h2>Virtual card</h2><div class="pc ${c.frozen?'fz':''}"><div class="pt"><b>PAYNEX</b><span>${c.frozen?'Frozen':'Active'}</span></div><div class="chip"></div><div class="n">${n}</div><div class="pb"><div><small>Cardholder</small><br>${esc(me.name.toUpperCase())}</div><div><small>Expires</small><br>${c.exp}</div><div class="mc"><i></i><i></i></div></div><em class="sim">SIMULATED</em></div><div class="card" style="max-width:380px;margin-top:16px"><h3>Card controls</h3><p style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px"><button onclick="V.show=!V.show;render()" class="s">${V.show?'Hide':'Show'} number</button> <button class="${c.frozen?'':'dg'}" onclick="frz()">${c.frozen?'Unfreeze card':'Freeze card'}</button></p><p class="mut" style="font-size:13px;margin:0">This is a simulated card and can’t be used for real purchases. While frozen, payments are declined.</p></div>`};
function frz(){act(sb.from('profiles').update({card_frozen:!me.card.frozen}).eq('id',me.id),me.card.frozen?'Card active':'Card frozen')}
P.savings=()=>{const gs=me.goals,h=gs.flatMap(g=>g.hist.map(x=>({...x,g:g.name}))).sort((a,b)=>b.d.localeCompare(a.d));return `<h2>Savings goals</h2><form class="card" style="max-width:420px" onsubmit="goal(event)" novalidate><h3>New goal</h3><label for="gn">Goal name</label><input id="gn" name="n" maxlength="40"><label for="gt">Target amount</label><input id="gt" name="t" type="number" step="1" min="1"><div class="msg" role="alert"></div><button>Create goal</button></form><div class="g" style="margin-top:16px">${gs.map((g,i)=>`<div class="card"><h3>${esc(g.name)}</h3><p>${money(g.saved)} of ${money(g.target)}</p><div class="bar2"><b style="width:${Math.min(100,g.saved/g.target*100)}%"></b></div><form onsubmit="fund(event,${i})" style="display:flex;gap:8px;margin-top:12px"><input name="a" type="number" step="0.01" min="0.01" placeholder="Amount" aria-label="Amount to add"><button>Add</button></form><div class="msg" role="alert"></div></div>`).join('')||`<div class="empty card" style="grid-column:1/-1">${ic('pig')}<b>No savings goals yet</b><span class="mut">Name a goal and a target above to start saving.</span></div>`}</div><div class="card" style="margin-top:16px"><h3>Savings history</h3>${h.length?`<div class="tl"><table>${h.map(x=>`<tr><td>${dt(x.d)}</td><td>${esc(x.g)}</td><td class="ok">+${money(x.a)}</td></tr>`).join('')}</table></div>`:`<div class="empty">${ic('pig')}<b>No deposits yet</b></div>`}</div>`};
function goal(e){const f=fd(e);if((f.n||'').trim().length<2)return fail(e,'Name your goal.');if(!(+f.t>0))return fail(e,'Enter a target above 0.');act(sb.from('goals').insert({user_id:me.id,name:f.n.trim(),target:+f.t}),'Goal created')}
function fund(e,i){const f=fd(e),a=+f.a;if(!(a>0))return fail(e,'Enter an amount.');if(a>bal(me))return fail(e,'Insufficient balance.');act(sb.rpc('demo_save',{goal:me.goals[i].id,amt:a}),'Added to savings')}
P.history=()=>{const h=V.h;return `<h2>Transaction history</h2><div class="card"><div class="g"><div><label for="q">Search</label><input id="q" value="${esc(h.q)}" oninput="V.h.q=this.value;hl()"></div><div><label for="ty">Type</label><select id="ty" onchange="V.h.type=this.value;hl()">${['','Transfer','Airtime','Bill','Savings','Income','Card'].map(x=>`<option value="${x}" ${h.type==x?'selected':''}>${x||'All types'}</option>`).join('')}</select></div><div><label for="st">Status</label><select id="st" onchange="V.h.st=this.value;hl()">${['','Completed','Flagged'].map(x=>`<option value="${x}" ${h.st==x?'selected':''}>${x||'Any status'}</option>`).join('')}</select></div><div><label for="fr">From</label><input id="fr" type="date" value="${h.from}" onchange="V.h.from=this.value;hl()"></div><div><label for="to">To</label><input id="to" type="date" value="${h.to}" onchange="V.h.to=this.value;hl()"></div></div><div id="hl" style="margin-top:12px">${hlist()}</div></div>`};
const hlist=()=>{const h=V.h,q=h.q.toLowerCase();return tbl(mine().filter(t=>(!q||(t.title+t.ref+t.id).toLowerCase().includes(q))&&(!h.type||t.type==h.type)&&(!h.st||t.status==h.st)&&(!h.from||t.date.slice(0,10)>=h.from)&&(!h.to||t.date.slice(0,10)<=h.to)))},hl=()=>$('#hl').innerHTML=hlist();
P.settings=()=>`<h2>Profile &amp; settings</h2><div class="g"><form class="card" onsubmit="prof(event)" novalidate><h3>Personal information</h3><label for="n">Full name</label><input id="n" name="name" value="${esc(me.name)}"><label for="e">Email</label><input id="e" value="${esc(me.email)}" disabled><label for="ph">Phone</label><input id="ph" name="phone" value="${esc(me.phone)}" inputmode="tel"><div class="msg" role="alert"></div><button>Save changes</button></form><form class="card" onsubmit="pw(event)" novalidate><h3>Update password</h3><label for="o">Current password</label>${PWF('o','o','current-password')}<label for="np">New password</label>${PWF('np','n','new-password')}<div class="msg" role="alert"></div><button>Update password</button></form><div class="card"><h3>Notifications</h3>${[['email','Email receipts'],['sms','SMS alerts'],['promo','Product news']].map(([k,t])=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${me.prefs[k]?'checked':''} onchange="pref('${k}',this.checked)">${t}</label>`).join('')}<h3 style="margin-top:20px">Security</h3><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${me.tfa?'checked':''} onchange="tfa(this.checked)">Two-step sign-in (demo toggle)</label></div></div>`;
function prof(e){const f=fd(e);if(f.name.trim().length<2)return fail(e,'Enter your name.');if(f.phone&&!/^[+\d\s()-]{7,16}$/.test(f.phone))return fail(e,'Enter a valid phone number.');act(sb.from('profiles').update({name:f.name.trim(),phone:f.phone}).eq('id',me.id),'Profile updated')}
async function pw(e){const f=fd(e);if(!V.rec){const r=await sb.auth.signInWithPassword({email:me.email,password:f.o||''});if(r.error)return fail(e,'Current password is incorrect.')}if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.n||''))return fail(e,'New password needs 8+ characters with letters and a number.');const{error}=await sb.auth.updateUser({password:f.n});if(error)return fail(e,error.message);V.rec=false;e.target.reset();toast('Password updated')}
P.admin=()=>{const c=D.tx.filter(t=>t.status=='Completed');return `<h2>Admin dashboard</h2><div class="stats s4">${[['Users',D.users.length,''],['Transactions',D.tx.length,''],['Volume',money(c.reduce((a,t)=>a+Math.abs(t.amt),0)),''],['Flagged',D.tx.filter(t=>t.status=='Flagged').length,'bad']].map(([a,b,k])=>`<div class="card"><span class="mut">${a}</span><div class="big ${k}">${b}</div></div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3>Customers</h3>${D.users.map((u,i)=>`<div class="row"><div class="rm"><b>${esc(u.name)}</b><br><span class="mut">${esc(u.email)}</span></div><div class="rs"><span class="pill">${u.role}</span><b>${money(bal(u))}</b>${st(u.status)}</div>${u.role=='admin'?'':`<button class="sm s" onclick="susp(${i})">${u.status=='active'?'Suspend':'Reactivate'}</button>`}</div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3>Transaction monitor</h3>${D.tx.slice(0,12).map(t=>`<div class="row"><div class="rm"><b>${esc(t.title)}</b><br><span class="mut">${esc(t.uid)} · ${dt(t.date)}</span></div><div class="rs"><b class="${t.amt<0?'':'ok'}">${money(t.amt)}</b>${st(t.status)}</div><button class="sm s" onclick="flag('${t.id}')">${t.status=='Completed'?'Flag':'Restore'}</button></div>`).join('')}</div>
<div class="card" style="margin-top:16px"><h3>Platform activity</h3>${D.log.slice(0,10).map(l=>`<p style="margin:0 0 6px" class="mut">${new Date(l.d).toLocaleString()} – ${esc(l.m)}</p>`).join('')||'<p class="mut">No activity yet.</p>'}</div>`};
function susp(i){const u=D.users[i];act(sb.rpc('admin_set_user_status',{uid:u.id,new_status:u.status=='active'?'suspended':'active'}),u.name+' updated')}
function flag(id){const t=D.tx.find(x=>x.id==id),n=t.status=='Completed'?'Flagged':'Completed';act(sb.rpc('admin_set_tx_status',{tid:id,new_status:n}),'Transaction '+n.toLowerCase())}

function render(){let r=location.hash.slice(1)||'home';const anch=['services','security','faq'];const open=['home','login','register','forgot',...anch];
if(!open.includes(r)&&!me){r='login'}if(me&&['login','register','forgot'].includes(r))r='dashboard';if(r=='admin'&&me?.role!='admin')r=me?'dashboard':'login';if(!P[r]&&!anch.includes(r))r=me?'dashboard':'home';
document.body.classList.toggle('in',!!me);document.title='PAYNEX – '+r[0].toUpperCase()+r.slice(1);$('#app').innerHTML=shell((P[r]||P.home)(),r);closeM();if(anch.includes(r)){const el=$('#'+r);el&&el.scrollIntoView()}else if(!V.keep)scrollTo(0,0)}
addEventListener('hashchange',()=>{V.tr={step:1};render()});
(async()=>{D={users:[],tx:[],log:[]};sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')setTimeout(async()=>{V.rec=true;await sync();go('settings');render()},0)});await sync();render()})();
