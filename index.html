<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PAYNEX FINTECH – Demo banking platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>

@media print{.demo,header,main,footer,#toast,.np{display:none!important}.modal{position:static;background:none}}
</style></head><body><div id="app"></div><div id="m"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=s=>new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),rid=()=>Math.random().toString(36).slice(2,10).toUpperCase();

const IC={send:'M22 2 11 13M22 2l-7 20-4-9-9-4z',card:'M2 5h20v14H2zM2 10h20',pig:'M4 12a8 8 0 0 1 16 0 8 8 0 0 1-4 7v2h-3v-1h-2v1H8v-2a8 8 0 0 1-4-7z',bolt:'M13 2 3 14h9l-1 8 10-12h-9z',shield:'M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',user:'M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'};
const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
let D,me=null,V={tr:{step:1},pay:'air',h:{q:'',type:'',from:'',to:'',st:''},show:false};
const save=()=>{try{localStorage.setItem('pnx3',JSON.stringify(D))}catch(e){}};
const setS=e=>{try{e?sessionStorage.setItem('pnxs',e):sessionStorage.removeItem('pnxs')}catch(x){}},getS=()=>{try{return sessionStorage.getItem('pnxs')}catch(x){return null}};
const bal=u=>D.tx.filter(t=>t.uid==u.email&&t.status=='Completed').reduce((a,t)=>a+t.amt,0);
const log=m=>{D.log.unshift({d:new Date().toISOString(),m});D.log=D.log.slice(0,40)};
function add(u,o){const t={id:'TX'+rid(),uid:u.email,status:'Completed',date:new Date().toISOString(),ref:rid(),...o};D.tx.unshift(t);log(`${u.name}: ${t.type} – ${t.title}`);save();return t}
async function seed(){const day=n=>new Date(Date.now()-n*864e5).toISOString(),g=()=>[0,0,0,0].map(()=>String(1000+Math.floor(Math.random()*9000))).join(' ');
const mk=async(email,name,role,pw)=>({email,name,role,pw:await sha(pw),phone:'',acct:'PNX-'+(1e9+Math.floor(Math.random()*9e9)),status:'active',joined:day(30),card:{frozen:false,num:'5300 '+g().slice(5),exp:'09/29'},goals:[],prefs:{email:true,sms:false,promo:false},tfa:false});
D={users:[await mk('demo@paynex.demo','Jordan Demo','user','Demo1234'),await mk('amina@paynex.demo','Amina Okoye','user','Demo1234'),await mk('admin@paynex.demo','Admin Demo','admin','Admin1234')],tx:[],log:[]};
const d=D.users[0];[[30,'Income','Welcome demo credit',5000],[14,'Income','Salary (demo)',2400],[12,'Bill','Electricity – VoltCo',-86.4],[9,'Airtime','Airtime – Nova Mobile',-10],[7,'Transfer','To Amina Okoye',-150],[4,'Card','Coffee Lab',-12.5],[3,'Bill','Internet – FibreNet',-54],[1,'Income','Freelance (demo)',320]].forEach(([n,type,title,amt])=>D.tx.push({id:'TX'+rid(),uid:d.email,type,title,amt,status:'Completed',date:day(n),ref:rid()}));D.tx.reverse();D.tx.sort((a,b)=>b.date.localeCompare(a.date));D.users[1].card.num='5300 '+g().slice(5);D.tx.push({id:'TX'+rid(),uid:D.users[1].email,type:'Income',title:'Welcome demo credit',amt:3000,status:'Completed',date:day(20),ref:rid()});save()}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'e':'';t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,3200)}
const fail=(e,m)=>{e.target.querySelector('.msg').textContent=m;return null},fd=e=>{e.preventDefault();e.target.querySelector('.msg').textContent='';return Object.fromEntries(new FormData(e.target))};
const go=r=>location.hash=r;
const PUB=[['home','Home'],['services','Services'],['security','Security'],['faq','FAQ']],USR=[['dashboard','Dashboard'],['transfer','Transfer'],['payments','Payments'],['cards','Cards'],['savings','Savings'],['history','History'],['settings','Settings']];
function shell(body,r){const L=me?[...USR,...(me.role=='admin'?[['admin','Admin']]:[])]:PUB;
return `<div class="demo">DEMO ONLY – fictional balances, no real money. PAYNEX is a portfolio project, not a bank or licensed payment provider.</div><header><div class="bar"><button class="logo" onclick="go('${me?'dashboard':'home'}')" aria-label="PAYNEX home"><i></i>PAYNEX</button><nav aria-label="Main">${L.map(([k,t])=>`<a href="#${k}" class="${k==r?'on':''}">${t}</a>`).join('')}</nav><button class="sm s" style="color:#fff!important;border-color:#2a4660!important" onclick="theme()" aria-label="Toggle theme">◐</button>${me?`<button class="sm" onclick="out()">Sign out</button>`:`<a class="btn sm" href="#login">Sign in</a>`}</div></header><main>${body}</main><footer><div>© 2026 PAYNEX FINTECH · Designed &amp; Developed by Ahmad · Demonstration project only: no real banking, deposits, transfers or cards. All data is fictional and stored in your browser.</div></footer>`}
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function out(){setS(null);me=null;go('home');toast('Signed out')}
const P={};
P.home=()=>`<div class="hero"><div><h1>Banking you can rehearse before it’s real.</h1><p>PAYNEX is a demo digital bank: send money, pay bills, freeze a card and save toward goals, all with fictional funds.</p><a class="btn" href="#register">Open a demo account</a> <a class="btn s" href="#login" style="color:#fff!important;border-color:#2a4660!important">Try the demo login</a></div><div class="led" aria-label="Sample activity"><div><span>Salary (demo)</span><b class="ok">+$2,400.00</b></div><div><span>Rent – Harbor Flats</span><b>−$950.00</b></div><div><span>Savings: Lisbon trip</span><b>−$200.00</b></div><div><span>Status</span><b class="ok">Settled in 1.2s</b></div></div></div>
<section id="services"><h2>What you can do</h2><div class="g">${[['send','Transfers','Send to any PAYNEX user with a confirmation step and printable receipt.'],['bolt','Payments','Buy airtime and pay electricity, internet or water bills.'],['card','Virtual cards','View your demo card and freeze it instantly.'],['pig','Savings goals','Set a target, add funds, and watch progress.'],['list','History','Search and filter every transaction by date, type and status.'],['user','Admin tools','Monitor activity and manage demo users.']].map(([i,t,d])=>`<div class="card">${ic(i)}<h3>${t}</h3><p class="mut">${d}</p></div>`).join('')}</div></section>
<section id="security"><h2>Built to show how trust is designed</h2><div class="g"><div class="card">${ic('shield')}<h3>Hashed passwords</h3><p class="mut">Passwords are SHA-256 hashed before storage; sessions end when you close the tab.</p></div><div class="card"><h3>Role protection</h3><p class="mut">Admin pages are blocked for regular users.</p></div><div class="card"><h3>Clearly fictional</h3><p class="mut">Every balance is labelled DEMO. No real banking credentials are ever collected.</p></div></div></section>
<section><h2>How it works</h2><ol class="g" style="list-style:none;padding:0"><li class="card"><b>1. Register</b><br><span class="mut">Create an account and receive $5,000 demo credit.</span></li><li class="card"><b>2. Transact</b><br><span class="mut">Transfer, pay bills, save, freeze your card.</span></li><li class="card"><b>3. Review</b><br><span class="mut">Check history and print receipts.</span></li></ol><p class="mut">Demo logins: demo@paynex.demo / Demo1234 · admin@paynex.demo / Admin1234</p></section>
<section id="faq"><h2>FAQ</h2>${[['Is this a real bank?','No. PAYNEX is a portfolio demonstration with fictional money.'],['Where is my data stored?','Only in this browser’s local storage. Nothing is sent to a server.'],['Can I move real money?','No. There are no deposits, withdrawals, or real card issuance.'],['How do I reset?','Sign in as admin and choose “Reset demo data”.']].map(([q,a])=>`<details><summary>${q}</summary><p class="mut">${a}</p></details>`).join('')}</section>`;
P.login=()=>`<form class="card narrow" onsubmit="login(event)" novalidate><h2>Sign in</h2><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="username"><label for="p">Password</label><input id="p" name="pw" type="password" autocomplete="current-password"><div class="msg" role="alert"></div><button style="width:100%">Sign in</button><p style="margin-top:16px"><a href="#forgot">Forgot password?</a> · <a href="#register">Create account</a></p><p class="mut">Try demo@paynex.demo / Demo1234</p></form>`;
P.register=()=>`<form class="card narrow" onsubmit="reg(event)" novalidate><h2>Create demo account</h2><label for="n">Full name</label><input id="n" name="name" autocomplete="name"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email"><label for="p">Password (8+ characters, letters and a number)</label><input id="p" name="pw" type="password" autocomplete="new-password"><label for="c">Confirm password</label><input id="c" name="cf" type="password" autocomplete="new-password"><div class="msg" role="alert"></div><button style="width:100%">Create account</button><p class="mut" style="margin-top:12px">Demo only. Don’t enter real banking details.</p></form>`;
P.forgot=()=>`<form class="card narrow" onsubmit="forgot(event)" novalidate><h2>Reset password</h2><label for="e">Account email</label><input id="e" name="email" type="email"><div class="msg" role="alert"></div><button style="width:100%">Send reset link</button></form>`;
async function login(e){const f=fd(e),em=(f.email||'').trim().toLowerCase();if(!em||!f.pw)return fail(e,'Enter your email and password.');const u=D.users.find(x=>x.email==em);if(!u||u.pw!=await sha(f.pw))return fail(e,'Email or password is incorrect.');if(u.status!='active')return fail(e,'This demo account is suspended. Contact an admin.');me=u;setS(em);log(u.name+' signed in');save();toast('Welcome back, '+u.name.split(' ')[0]);go(u.role=='admin'?'admin':'dashboard')}
async function reg(e){const f=fd(e),em=(f.email||'').trim().toLowerCase();if((f.name||'').trim().length<2)return fail(e,'Enter your full name.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return fail(e,'Enter a valid email address.');if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.pw||''))return fail(e,'Password needs 8+ characters with letters and a number.');if(f.pw!=f.cf)return fail(e,'Passwords do not match.');if(D.users.find(x=>x.email==em))return fail(e,'That email already has an account.');
const g=()=>String(1000+Math.floor(Math.random()*9000)),u={email:em,name:f.name.trim(),role:'user',pw:await sha(f.pw),phone:'',acct:'PNX-'+(1e9+Math.floor(Math.random()*9e9)),status:'active',joined:new Date().toISOString(),card:{frozen:false,num:`5300 ${g()} ${g()} ${g()}`,exp:'09/29'},goals:[],prefs:{email:true,sms:false,promo:false},tfa:false};D.users.push(u);add(u,{type:'Income',title:'Welcome demo credit',amt:5000});me=u;setS(em);toast('Account created with $5,000 demo credit');go('dashboard')}
function forgot(e){const f=fd(e);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email||''))return fail(e,'Enter a valid email address.');e.target.innerHTML='<h2>Check your inbox</h2><p class="mut">If that demo account exists, a reset link would be sent. In this demo no email is actually sent. Sign in as a user and use Settings → Password to change it.</p><a class="btn" href="#login">Back to sign in</a>'}
const tr=(t)=>`<tr class="c" tabindex="0" onclick="detail('${t.id}')" onkeydown="if(event.key=='Enter')detail('${t.id}')"><td>${dt(t.date)}</td><td>${esc(t.title)}</td><td><span class="pill">${t.type}</span></td><td class="${t.amt<0?'':'ok'}">${money(t.amt)}</td><td class="${t.status=='Completed'?'ok':'bad'}">${t.status}</td></tr>`;
const mine=()=>D.tx.filter(t=>t.uid==me.email);
const tbl=a=>a.length?`<div class="tl"><table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${a.map(tr).join('')}</tbody></table></div>`:'<p class="mut">No transactions match yet. Make a transfer or payment to see it here.</p>';
P.dashboard=()=>{const t=mine().filter(x=>x.status=='Completed'),inc=t.filter(x=>x.amt>0).reduce((a,x)=>a+x.amt,0),exp=-t.filter(x=>x.amt<0).reduce((a,x)=>a+x.amt,0),cat={};t.filter(x=>x.amt<0).forEach(x=>cat[x.type]=(cat[x.type]||0)+-x.amt);const mx=Math.max(1,...Object.values(cat));
return `<h2>Hello, ${esc(me.name.split(' ')[0])}</h2><div class="g"><div class="card" style="background:var(--navy);color:#fff"><span style="opacity:.7">Available balance (DEMO)</span><div class="big">${money(bal(me))}</div></div><div class="card"><span class="mut">Total income</span><div class="big ok">${money(inc)}</div></div><div class="card"><span class="mut">Total expenses</span><div class="big">${money(-exp)}</div></div></div>
<p style="margin-top:16px"><a class="btn" href="#transfer">Send money</a> <a class="btn s" href="#payments">Pay a bill</a> <a class="btn s" href="#savings">Add savings</a> <a class="btn s" href="#cards">View card</a></p>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))"><div class="card"><h3>Spending overview</h3>${Object.entries(cat).map(([k,v])=>`<p style="margin:0 0 10px">${k} <span class="mut">${money(v)}</span></p><div class="bar2" style="margin-bottom:12px"><b style="width:${v/mx*100}%"></b></div>`).join('')||'<p class="mut">No spending yet.</p>'}</div><div class="card"><h3>Account</h3><p class="mut">Account no.<br><b style="color:var(--ink)">${me.acct}</b></p><p class="mut">Email<br><b style="color:var(--ink)">${esc(me.email)}</b></p><p class="mut">Member since<br><b style="color:var(--ink)">${dt(me.joined)}</b></p></div></div>
<div class="card" style="margin-top:16px"><h3>Recent transactions</h3>${tbl(mine().slice(0,5))}<a href="#history">View all</a></div>`};
function rcpt(t){return `<div class="modal" onclick="if(event.target==this)closeM()"><div class="card" role="dialog" aria-label="Receipt"><h3>PAYNEX receipt <span class="pill">DEMO</span></h3><p class="big ${t.amt<0?'':'ok'}">${money(t.amt)}</p><table>${[['Description',t.title],['Type',t.type],['Status',t.status],['Date',new Date(t.date).toLocaleString()],['Reference',t.ref],['Transaction ID',t.id],['Note',t.note||'–']].map(([a,b])=>`<tr><th>${a}</th><td style="white-space:normal">${esc(b)}</td></tr>`).join('')}</table><p class="mut" style="margin-top:12px;font-size:13px">Demonstration receipt. No real funds moved.</p><div class="np"><button onclick="print()">Print receipt</button> <button class="s" onclick="closeM()">Close</button></div></div></div>`}
const detail=id=>{$('#m').innerHTML=rcpt(D.tx.find(t=>t.id==id))},closeM=()=>$('#m').innerHTML='';
P.transfer=()=>{const s=V.tr;if(s.step==1)return `<form class="card narrow" onsubmit="trNext(event)" novalidate><h2>Send money</h2><p class="mut">Available: ${money(bal(me))} (DEMO)</p><label for="r">Recipient name</label><input id="r" name="rn" value="${esc(s.rn||'')}"><label for="a">Recipient email or account no.</label><input id="a" name="ra" value="${esc(s.ra||'')}" placeholder="amina@paynex.demo"><label for="m">Amount (USD)</label><input id="m" name="amt" type="number" step="0.01" min="0.01" value="${s.amt||''}"><label for="o">Note (optional)</label><input id="o" name="note" maxlength="60" value="${esc(s.note||'')}"><div class="msg" role="alert"></div><button style="width:100%">Review transfer</button></form>`;
if(s.step==2)return `<div class="card narrow"><h2>Confirm transfer</h2><p>Send <b>${money(+s.amt)}</b> to <b>${esc(s.rn)}</b> (${esc(s.ra)})?</p><p class="mut">${esc(s.note||'No note')}</p><button onclick="trGo()">Confirm and send</button> <button class="s" onclick="V.tr.step=1;render()">Edit</button></div>`;
if(s.step==3)return `<div class="card narrow"><h2>Processing…</h2><p class="mut">Verifying and settling your demo transfer.</p></div>`;
return `<div class="card narrow"><h2 class="ok">Transfer completed</h2><p>${money(+s.amt)} sent to ${esc(s.rn)}.</p><button onclick="detail('${s.id}')">View receipt</button> <button class="s" onclick="V.tr={step:1};render()">New transfer</button></div>`};
function trNext(e){const f=fd(e),a=+f.amt;if((f.rn||'').trim().length<2)return fail(e,'Enter the recipient’s name.');if((f.ra||'').trim().length<4)return fail(e,'Enter a recipient email or account number.');if(!(a>0))return fail(e,'Enter an amount greater than 0.');if(a>10000)return fail(e,'Demo limit is $10,000 per transfer.');if(a>bal(me))return fail(e,'Insufficient demo balance.');if(f.ra.trim().toLowerCase()==me.email)return fail(e,'You can’t send money to yourself.');V.tr={step:2,...f};render()}
function trGo(){V.tr.step=3;render();setTimeout(()=>{const s=V.tr;if(+s.amt>bal(me)){V.tr.step=1;render();return toast('Insufficient balance',1)}const t=add(me,{type:'Transfer',title:'To '+s.rn,amt:-+s.amt,note:s.note});const r=D.users.find(u=>u.email==s.ra.trim().toLowerCase()||u.acct==s.ra.trim());if(r)add(r,{type:'Income',title:'From '+me.name,amt:+s.amt,note:s.note});V.tr={...s,step:4,id:t.id};render();toast('Transfer completed')},1200)}
const PROV={air:['Nova Mobile','Zeta Telecom','Orbit Wireless'],bill:['Electricity – VoltCo','Internet – FibreNet','Water – AquaCity']};
P.payments=()=>{const k=V.pay,h=mine().filter(t=>['Airtime','Bill'].includes(t.type));return `<h2>Payments</h2><div class="tabs"><button class="${k=='air'?'on':''}" onclick="V.pay='air';render()">Airtime</button><button class="${k=='bill'?'on':''}" onclick="V.pay='bill';render()">Bills</button></div><form class="card" style="max-width:420px" onsubmit="pay(event)" novalidate><label for="pv">${k=='air'?'Network':'Provider'}</label><select id="pv" name="pv">${PROV[k].map(p=>`<option>${p}</option>`).join('')}</select><label for="ac">${k=='air'?'Phone number':'Customer account number'}</label><input id="ac" name="ac" inputmode="numeric"><label for="am">Amount (USD)</label><input id="am" name="amt" type="number" step="0.01" min="1"><p class="mut" style="font-size:13px">Paid with your virtual card${me.card.frozen?' <b class="bad">(frozen – unfreeze to pay)</b>':''}.</p><div class="msg" role="alert"></div><button>Pay now</button></form><div class="card" style="margin-top:16px"><h3>Payment history</h3>${tbl(h)}</div>`};
function pay(e){const f=fd(e),a=+f.amt,k=V.pay;if(!/^\d{6,14}$/.test((f.ac||'').replace(/\s/g,'')))return fail(e,'Enter a valid number (6–14 digits).');if(!(a>=1))return fail(e,'Minimum payment is $1.00.');if(a>bal(me))return fail(e,'Insufficient demo balance.');if(me.card.frozen)return fail(e,'Your card is frozen. Unfreeze it on the Cards page.');const t=add(me,{type:k=='air'?'Airtime':'Bill',title:(k=='air'?'Airtime – ':'')+f.pv,amt:-a,note:'Account '+f.ac});toast('Payment successful');render();detail(t.id)}
P.cards=()=>{const c=me.card,n=V.show?c.num:'•••• •••• •••• '+c.num.slice(-4);return `<h2>Virtual card</h2><div class="pc ${c.frozen?'fz':''}"><div style="display:flex;justify-content:space-between"><b>PAYNEX</b><span>${c.frozen?'FROZEN':'ACTIVE'} · DEMO</span></div><div class="n">${n}</div><div style="display:flex;justify-content:space-between"><span>${esc(me.name.toUpperCase())}</span><span>EXP ${c.exp}</span></div></div><p style="margin-top:16px"><button onclick="V.show=!V.show;render()" class="s">${V.show?'Hide':'Show'} number</button> <button class="${c.frozen?'':'dg'}" onclick="frz()">${c.frozen?'Unfreeze card':'Freeze card'}</button></p><p class="mut">Fictional demo card. It can’t be used anywhere. While frozen, payments on the Payments page are declined.</p>`};
function frz(){me.card.frozen=!me.card.frozen;log(me.name+(me.card.frozen?' froze':' unfroze')+' card');save();render();toast(me.card.frozen?'Card frozen':'Card active')}
P.savings=()=>{const gs=me.goals,h=gs.flatMap(g=>g.hist.map(x=>({...x,g:g.name}))).sort((a,b)=>b.d.localeCompare(a.d));return `<h2>Savings goals</h2><form class="card" style="max-width:420px" onsubmit="goal(event)" novalidate><h3>New goal</h3><label for="gn">Goal name</label><input id="gn" name="n" maxlength="40"><label for="gt">Target amount</label><input id="gt" name="t" type="number" step="1" min="1"><div class="msg" role="alert"></div><button>Create goal</button></form><div class="g" style="margin-top:16px">${gs.map((g,i)=>`<div class="card"><h3>${esc(g.name)}</h3><p>${money(g.saved)} of ${money(g.target)}</p><div class="bar2"><b style="width:${Math.min(100,g.saved/g.target*100)}%"></b></div><form onsubmit="fund(event,${i})" style="display:flex;gap:8px;margin-top:12px"><input name="a" type="number" step="0.01" min="0.01" placeholder="Amount" aria-label="Amount to add"><button>Add</button></form><div class="msg" role="alert"></div></div>`).join('')||'<p class="mut">Create your first goal above.</p>'}</div><div class="card" style="margin-top:16px"><h3>Savings history</h3>${h.length?`<div class="tl"><table>${h.map(x=>`<tr><td>${dt(x.d)}</td><td>${esc(x.g)}</td><td class="ok">+${money(x.a)}</td></tr>`).join('')}</table></div>`:'<p class="mut">No deposits yet.</p>'}</div>`};
function goal(e){const f=fd(e);if((f.n||'').trim().length<2)return fail(e,'Name your goal.');if(!(+f.t>0))return fail(e,'Enter a target above 0.');me.goals.push({name:f.n.trim(),target:+f.t,saved:0,hist:[]});save();render();toast('Goal created')}
function fund(e,i){const f=fd(e),a=+f.a;if(!(a>0))return fail(e,'Enter an amount.');if(a>bal(me))return fail(e,'Insufficient demo balance.');const g=me.goals[i];g.saved+=a;g.hist.push({d:new Date().toISOString(),a});add(me,{type:'Savings',title:'Savings: '+g.name,amt:-a});render();toast(g.saved>=g.target?'Goal reached!':'Added to savings')}
P.history=()=>{const h=V.h;return `<h2>Transaction history</h2><div class="card"><div class="g"><div><label for="q">Search</label><input id="q" value="${esc(h.q)}" oninput="V.h.q=this.value;hl()"></div><div><label for="ty">Type</label><select id="ty" onchange="V.h.type=this.value;hl()">${['','Transfer','Airtime','Bill','Savings','Income','Card'].map(x=>`<option value="${x}" ${h.type==x?'selected':''}>${x||'All types'}</option>`).join('')}</select></div><div><label for="st">Status</label><select id="st" onchange="V.h.st=this.value;hl()">${['','Completed','Flagged'].map(x=>`<option value="${x}" ${h.st==x?'selected':''}>${x||'Any status'}</option>`).join('')}</select></div><div><label for="fr">From</label><input id="fr" type="date" value="${h.from}" onchange="V.h.from=this.value;hl()"></div><div><label for="to">To</label><input id="to" type="date" value="${h.to}" onchange="V.h.to=this.value;hl()"></div></div><div id="hl" style="margin-top:12px">${hlist()}</div></div>`};
const hlist=()=>{const h=V.h,q=h.q.toLowerCase();return tbl(mine().filter(t=>(!q||(t.title+t.ref+t.id).toLowerCase().includes(q))&&(!h.type||t.type==h.type)&&(!h.st||t.status==h.st)&&(!h.from||t.date.slice(0,10)>=h.from)&&(!h.to||t.date.slice(0,10)<=h.to)))},hl=()=>$('#hl').innerHTML=hlist();
P.settings=()=>`<h2>Profile &amp; settings</h2><div class="g"><form class="card" onsubmit="prof(event)" novalidate><h3>Personal information</h3><label for="n">Full name</label><input id="n" name="name" value="${esc(me.name)}"><label for="e">Email</label><input id="e" value="${esc(me.email)}" disabled><label for="ph">Phone</label><input id="ph" name="phone" value="${esc(me.phone)}" inputmode="tel"><div class="msg" role="alert"></div><button>Save changes</button></form><form class="card" onsubmit="pw(event)" novalidate><h3>Update password</h3><label for="o">Current password</label><input id="o" name="o" type="password" autocomplete="current-password"><label for="np">New password</label><input id="np" name="n" type="password" autocomplete="new-password"><div class="msg" role="alert"></div><button>Update password</button></form><div class="card"><h3>Notifications</h3>${[['email','Email receipts'],['sms','SMS alerts'],['promo','Product news']].map(([k,t])=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${me.prefs[k]?'checked':''} onchange="me.prefs.${k}=this.checked;save();toast('Preference saved')">${t}</label>`).join('')}<h3 style="margin-top:20px">Security</h3><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:auto" ${me.tfa?'checked':''} onchange="me.tfa=this.checked;save();toast('Two-step sign-in '+(this.checked?'on (demo)':'off'))">Two-step sign-in (demo toggle)</label></div></div>`;
function prof(e){const f=fd(e);if(f.name.trim().length<2)return fail(e,'Enter your name.');if(f.phone&&!/^[+\d\s()-]{7,16}$/.test(f.phone))return fail(e,'Enter a valid phone number.');me.name=f.name.trim();me.phone=f.phone;save();render();toast('Profile updated')}
async function pw(e){const f=fd(e);if(me.pw!=await sha(f.o||''))return fail(e,'Current password is incorrect.');if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(f.n||''))return fail(e,'New password needs 8+ characters with letters and a number.');me.pw=await sha(f.n);save();e.target.reset();toast('Password updated')}
P.admin=()=>{const c=D.tx.filter(t=>t.status=='Completed');return `<h2>Admin dashboard</h2><div class="g"><div class="card"><span class="mut">Users</span><div class="big">${D.users.length}</div></div><div class="card"><span class="mut">Transactions</span><div class="big">${D.tx.length}</div></div><div class="card"><span class="mut">Demo volume</span><div class="big">${money(c.reduce((a,t)=>a+Math.abs(t.amt),0))}</div></div><div class="card"><span class="mut">Flagged</span><div class="big bad">${D.tx.filter(t=>t.status=='Flagged').length}</div></div></div>
<div class="card" style="margin-top:16px"><h3>Demo users</h3><div class="tl"><table>${D.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${money(bal(u))}</td><td class="${u.status=='active'?'ok':'bad'}">${u.status}</td><td>${u.role=='admin'?'':`<button class="sm s" onclick="susp(${i})">${u.status=='active'?'Suspend':'Reactivate'}</button>`}</td></tr>`).join('')}</table></div></div>
<div class="card" style="margin-top:16px"><h3>Transaction monitor</h3><div class="tl"><table>${D.tx.slice(0,12).map(t=>`<tr><td>${dt(t.date)}</td><td>${esc(t.uid)}</td><td>${esc(t.title)}</td><td>${money(t.amt)}</td><td class="${t.status=='Completed'?'ok':'bad'}">${t.status}</td><td><button class="sm s" onclick="flag('${t.id}')">${t.status=='Completed'?'Flag':'Restore'}</button></td></tr>`).join('')}</table></div></div>
<div class="card" style="margin-top:16px"><h3>Platform activity</h3>${D.log.slice(0,10).map(l=>`<p style="margin:0 0 6px" class="mut">${new Date(l.d).toLocaleString()} – ${esc(l.m)}</p>`).join('')||'<p class="mut">No activity.</p>'}<button class="dg sm" onclick="if(confirm('Reset all demo data?'))reset()">Reset demo data</button></div>`};
function susp(i){const u=D.users[i];u.status=u.status=='active'?'suspended':'active';log('Admin set '+u.name+' '+u.status);save();render();toast(u.name+' '+u.status)}
function flag(id){const t=D.tx.find(x=>x.id==id);t.status=t.status=='Completed'?'Flagged':'Completed';log('Admin set '+t.id+' '+t.status);save();render()}
async function reset(){localStorage.removeItem('pnx3');setS(null);me=null;await seed();go('login');toast('Demo data reset')}
function render(){let r=location.hash.slice(1)||'home';const anch=['services','security','faq'];const open=['home','login','register','forgot',...anch];
if(!open.includes(r)&&!me){r='login'}if(me&&['login','register','forgot'].includes(r))r='dashboard';if(r=='admin'&&me?.role!='admin')r=me?'dashboard':'login';if(!P[r]&&!anch.includes(r))r=me?'dashboard':'home';
document.title='PAYNEX – '+r[0].toUpperCase()+r.slice(1);$('#app').innerHTML=shell((P[r]||P.home)(),r);closeM();if(anch.includes(r)){const el=$('#'+r);el&&el.scrollIntoView()}else if(!V.keep)scrollTo(0,0)}
addEventListener('hashchange',()=>{V.tr={step:1};render()});
(async()=>{try{D=JSON.parse(localStorage.getItem('pnx3'))}catch(e){}if(!D)await seed();const s=getS();me=s&&D.users.find(u=>u.email==s&&u.status=='active')||null;render()})();
</script></body></html>
